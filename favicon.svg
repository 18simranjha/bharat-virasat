<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8f5b1d" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#143530" />
      <stop offset="100%" stop-color="#08101a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with Gold Border -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />
  
  <!-- Central Monument / Temple Stupa Motif -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Kalasha / Pinnacle Flag -->
    <path d="M64 20 L66 28 L62 28 Z" />
    <circle cx="64" cy="20" r="2.5" />
    <path d="M64 28 L72 37 L56 37 Z" />
    
    <!-- Shikhara / Dome Tier -->
    <path d="M64 36 C76 43, 80 50, 82 56 L46 56 C48 50, 52 43, 64 36 Z" />
    
    <!-- Cornice Layer -->
    <rect x="42" y="56" width="44" height="4" rx="1.5" />
    
    <!-- Sanctum Pillars & Gateway -->
    <rect x="44" y="60" width="40" height="28" rx="1" />
    <!-- Arch Gateway Opening -->
    <path d="M56 88 L56 74 C56 69, 72 69, 72 74 L72 88 Z" fill="#08101a" />
    
    <!-- Outer Columns -->
    <rect x="41" y="62" width="4.5" height="26" rx="1" />
    <rect x="82.5" y="62" width="4.5" height="26" rx="1" />
    
    <!-- Base Plinth -->
    <rect x="36" y="88" width="56" height="5" rx="1.5" />
    <rect x="32" y="93" width="64" height="6" rx="2" />
    <rect x="28" y="99" width="72" height="5" rx="2" />
  </g>
  
  <!-- Subtle Stars / Sparkles -->
  <circle cx="36" cy="40" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="92" cy="40" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="28" cy="66" r="1.2" fill="#fef08a" opacity="0.6" />
  <circle cx="100" cy="66" r="1.2" fill="#fef08a" opacity="0.6" />
</svg>
